name: "Export & Deploy Web to itch.io"

on:
  push:
    branches:
      - main

env:
  # Set your Godot version here
  GODOT_VERSION: "4.6-stable"
  BUILD_DIR: "build/web"

jobs:
  export-and-deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 unzip wget

      - name: Download & Install Godot Engine & Templates
        run: |
          # Format Godot 3 template folder name (converts '3.6.3-stable' to '3.6.3.stable')
          GODOT_TEMPLATE_VER=$(echo "${GODOT_VERSION}" | tr '-' '.')

          # 1. Download and set up Godot Headless Binary
          mkdir -p ~/.local/bin
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
          unzip "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
          mv "Godot_v${GODOT_VERSION}_linux_headless.64" ~/.local/bin/godot
          chmod +x ~/.local/bin/godot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # 2. Download and set up Export Templates
          TEMPLATE_DIR="$HOME/.local/share/godot/templates/${GODOT_TEMPLATE_VER}"
          mkdir -p "$TEMPLATE_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip "Godot_v${GODOT_VERSION}_export_templates.tpz"
          mv templates/* "$TEMPLATE_DIR/"
          rm -rf templates "Godot_v${GODOT_VERSION}_export_templates.tpz" "Godot_v${GODOT_VERSION}_linux_headless.64.zip"

      - name: Create Build Directory
        run: mkdir -p ${BUILD_DIR}

      - name: Export Web Game
        run: godot --headless --export-release "Web" ${BUILD_DIR}/index.html

      - name: Publish to itch.io via Butler
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: web
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          PACKAGE: ${{ env.BUILD_DIR }}
